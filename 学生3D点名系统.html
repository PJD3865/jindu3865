    <script>
        // 初始化变量
        let scene, camera, renderer, sphere, names;
        let isRotating = true;
        let rotationSpeed = 0.02;
        let selectedStudent = null;
        let nameObjects = [];
        let isAccelerating = false;

        // 汉字转拼音的简化实现

                '墨': 'mò', '汪': 'wāng', '思': 'sī', '炜': 'wěi', '王': 'wáng',
                '家': 'jiā', '航': 'háng', '昕': 'xīn', '宸': 'chén', '一': 'yī',
                '欢': 'huān', '吴': 'wú', '汐': 'xī', '肖': 'xiāo', '曾': 'zēng',
                '笙': 'shēng', '桉': 'ān', '张': 'zhāng', '景': 'jǐng', '婧': 'jìng',
                '妍': 'yán', '宜': 'yí', '槿': 'jǐn', '桐': 'tóng', '赵': 'zhào',
                '君': 'jūn', '周': 'zhōu', '萱': 'xuān', '瑾': 'jǐn', '柔': 'róu',

            let pinyin = '';
            for (let i = 0; i < name.length; i++) {
                const char = name[i];
                pinyin += (pinyinMap[char] || char) + ' ';
            }
            return pinyin.trim();
        }

        // 原始学生名单
        let students = [
          "张宇轩", "李雨桐", "王梓涵", "刘思琪", "陈俊豪", "杨佳怡", "赵浩然", "吴雨薇", "周逸飞", "徐梦琪", "马子昂", "孙雨欣", "朱梓睿", "胡语彤", "郭宇航", "林诗涵", "何子轩", "高雨菲", "罗逸晨", "郑梦琪", "梁宇恒", "谢雨桐", "宋梓豪", "唐思怡", "许浩然", "邓雨薇", "韩逸飞", "冯梦琪", "曹子昂", "彭雨欣"
        ];

        // 初始化Three.js场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            
            // 创建相机
            const canvasWidth = document.getElementById('canvas-container').clientWidth;
            const canvasHeight = window.innerHeight;
            camera = new THREE.PerspectiveCamera(75, canvasWidth / canvasHeight, 0.1, 1000);
            camera.position.z = 5;
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(canvasWidth, canvasHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 添加星空背景
            addStarBackground();
            
            // 创建透明球体
            createTransparentSphere();
            
            // 在学生名字周围分布学生名字
            distributeNames();
            
            // 添加光源
            addLighting();
            
            // 添加鼠标控制
            addControls();
            
            // 添加缩放控制
            addZoomControls();
            
            // 开始动画循环
            animate();
            
            // 窗口调整大小时调整渲染器
            window.addEventListener('resize', onWindowResize);
        }
        
        // 添加星空背景
        function addStarBackground() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 5000; // 减少星星数量以提高性能
            const positionArray = new Float32Array(starCount * 3);
            
            for (let i = 0; i < starCount * 3; i += 3) {
                positionArray[i] = (Math.random() - 0.5) * 2000;
                positionArray[i+1] = (Math.random() - 0.5) * 2000;
                positionArray[i+2] = (Math.random() - 0.5) * 2000;
            }
            
            starGeometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.2,
                transparent: true
            });
            
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }
        
        // 创建透明球体
        function createTransparentSphere() {
            const geometry = new THREE.SphereGeometry(3, 24, 24); // 减少几何体细节提高性能
            const material = new THREE.MeshPhongMaterial({
                color: 0x77aaff,
                transparent: true,
                opacity: 0.3,
                specular: 0x555555,
                shininess: 100
            });
            
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);
        }
        
        // 分布学生名字
        function distributeNames() {
            names = new THREE.Group();
            
            // 使用斐波那契分布算法均匀分布点
            const numPoints = students.length;
            const points = [];
            
            const phi = Math.PI * (3 - Math.sqrt(5)); // 黄金角
            
            for (let i = 0; i < numPoints; i++) {
                const y = 1 - (i / (numPoints - 1)) * 2;
                const radius = Math.sqrt(1 - y * y);
                
                const theta = phi * i;
                
                const x = Math.cos(theta) * radius;
                const z = Math.sin(theta) * radius;
                
                points.push(new THREE.Vector3(x, y, z));
            }
            
            // 创建文本精灵
            const loader = new THREE.TextureLoader();
            
            points.forEach((point, index) => {
                const student = students[index];
                
                // 创建canvas用于绘制文本
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 128;
                
                // 绘制文本
                context.fillStyle = '#ffffff';
                context.font = 'bold 28px Microsoft YaHei';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(student, canvas.width / 2, canvas.height / 2);
                
                // 创建纹理和材质
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ 
                    map: texture,
                    transparent: true 
                });
                
                // 创建精灵
                const sprite = new THREE.Sprite(material);
                sprite.position.copy(point.multiplyScalar(3.2)); // 稍微在球体外部
                sprite.scale.set(2, 1, 1);
                
                // 存储学生信息
                sprite.userData = { 
                    student: student,
                    originalScale: sprite.scale.clone(),
                    originalColor: '#ffffff'
                };
                
                nameObjects.push(sprite);
                names.add(sprite);
            });
            
            scene.add(names);
        }
        
        // 添加光源
        function addLighting() {
            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
        }
        
        // 添加鼠标控制
        function addControls() {
            let isMouseDown = false;
            let previousMousePosition = {
                x: 0,
                y: 0
            };
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                previousMousePosition = {
                    x: e.clientX,
                    y: e.clientY
                };
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                
                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };
                
                names.rotation.y += deltaMove.x * 0.01;
                names.rotation.x += deltaMove.y * 0.01;
                
                previousMousePosition = {
                    x: e.clientX,
                    y: e.clientY
                };
            });
            
            // 添加触摸事件支持
            renderer.domElement.addEventListener('touchstart', (e) => {
                isMouseDown = true;
                previousMousePosition = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
                e.preventDefault();
            });
            
            renderer.domElement.addEventListener('touchend', () => {
                isMouseDown = false;
            });
            
            renderer.domElement.addEventListener('touchmove', (e) => {
                if (!isMouseDown) return;
                
                const deltaMove = {
                    x: e.touches[0].clientX - previousMousePosition.x,
                    y: e.touches[0].clientY - previousMousePosition.y
                };
                
                names.rotation.y += deltaMove.x * 0.01;
                names.rotation.x += deltaMove.y * 0.01;
                
                previousMousePosition = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY
                };
                
                e.preventDefault();
            });
        }
        
        // 添加缩放控制
        function addZoomControls() {
            // 鼠标滚轮缩放
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                // 限制缩放范围
                camera.position.z = Math.max(3, Math.min(15, camera.position.z));
            });
            
            // 缩放按钮控制
            document.getElementById('zoom-in').addEventListener('click', () => {
                camera.position.z -= 0.5;
                camera.position.z = Math.max(3, camera.position.z);
            });
            
            document.getElementById('zoom-out').addEventListener('click', () => {
                camera.position.z += 0.5;
                camera.position.z = Math.min(15, camera.position.z);
            });
        }
        
        // 窗口调整大小时调整渲染器
        function onWindowResize() {
            const canvasWidth = document.getElementById('canvas-container').clientWidth;
            const canvasHeight = window.innerHeight;
            
            camera.aspect = canvasWidth / canvasHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasWidth, canvasHeight);
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (isRotating) {
                // 根据是否加速调整旋转速度
                const currentSpeed = isAccelerating ? rotationSpeed * 6 : rotationSpeed;
                names.rotation.x += currentSpeed * 0.5;
                names.rotation.y += currentSpeed;
            }
            
            renderer.render(scene, camera);
        }
        
        // 开始点名
        function startRoll() {
            isRotating = true;
            isAccelerating = true; // 设置为加速状态
            document.getElementById('result').classList.remove('show');
            
            // 重置所有名字的样式
            nameObjects.forEach(name => {
                name.scale.copy(name.userData.originalScale);
                name.material.color.set(name.userData.originalColor);
                name.material.opacity = 1;
            });
        }
        
        // 停止点名
        function stopRoll() {
            isRotating = false;
            isAccelerating = false;
            
            // 随机选择一个学生
            const randomIndex = Math.floor(Math.random() * students.length);
            selectedStudent = students[randomIndex];
            
            // 显示结果
            const resultElement = document.getElementById('result');
            resultElement.textContent = selectedStudent;
            resultElement.classList.add('show');
            
            // 高亮选中的学生
            nameObjects.forEach(name => {
                if (name.userData.student === selectedStudent) {
                    name.scale.set(3, 1.5, 1);
                    name.material.color.set(0xffd700); // 金黄色
                    
                    // 旋转球体使选中的学生朝向正面
                    const index = nameObjects.indexOf(name);
                    const phi = Math.PI * (3 - Math.sqrt(5)); // 黄金角
                    const y = 1 - (index / (students.length - 1)) * 2;
                    const theta = phi * index;
                    
                    // 平滑旋转到选中位置
                    smoothRotateTo(-y * 0.5, -theta + Math.PI);
                } else {
                    // 淡化其他学生名字
                    name.material.opacity = 0.3;
                }
            });
        }
        
        // 平滑旋转到目标位置
        function smoothRotateTo(targetX, targetY) {
            const duration = 1000; // 旋转持续时间（毫秒）
            const startX = names.rotation.x;
            const startY = names.rotation.y;
            const startTime = Date.now();
            
            function updateRotation() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数使旋转更平滑
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                names.rotation.x = startX + (targetX - startX) * easeProgress;
                names.rotation.y = startY + (targetY - startY) * easeProgress;
                
                if (progress < 1) {
                    requestAnimationFrame(updateRotation);
                }
            }
            
            updateRotation();
        }
        
        // 下载模板文件
        function downloadTemplate() {
            const templateContent = '张三\n李四\n王五\n赵六\n\n# 使用说明：\n# 1. 每行一个学生姓名\n# 2. 删除示例姓名，填入真实姓名\n# 3. 保存为.txt文件\n# 4. 点击导入姓名按钮上传';
            
            const blob = new Blob([templateContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '学生姓名模板.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        // 导入姓名文件
        function importNames() {
            document.getElementById('file-input').click();
        }
        
        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                // 按行分割，过滤空行和注释行
                const newStudents = content
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#'));
                
                if (newStudents.length === 0) {
                    alert('文件中没有有效的学生姓名！');
                    return;
                }
                
                // 更新学生名单
                students = newStudents;
                
                // 清除旧的名字对象
                nameObjects.forEach(obj => {
                    names.remove(obj);
                });
                nameObjects = [];
                
                // 重新分布名字
                distributeNames();
                
                // 更新学生总数
                document.getElementById('count').textContent = students.length;
                
                // 重置状态
                reset();
                
                alert(`成功导入 ${students.length} 个学生姓名！`);
            };
            
            reader.readAsText(file, 'UTF-8');
            
            // 清空input，允许重复上传同一文件
            event.target.value = '';
        }
        
        // 重置
        function reset() {
            isRotating = true;
            isAccelerating = false;
            document.getElementById('result').classList.remove('show');
            
            // 重置所有名字的样式
            nameObjects.forEach(name => {
                name.scale.copy(name.userData.originalScale);
                name.material.color.set(name.userData.originalColor);
                name.material.opacity = 1;
            });
            
            // 随机旋转角度
            names.rotation.x = Math.random() * Math.PI * 2;
            names.rotation.y = Math.random() * Math.PI * 2;
            
            // 重置相机位置
            camera.position.z = 5;
        }
        
        // 初始化
        function initializeApp() {
            // 检查three.js是否已加载
            if (typeof THREE === 'undefined') {
                console.error('Three.js not loaded');
                return;
            }
            
            init();
            
            // 添加按钮事件监听
            document.getElementById('start-btn').addEventListener('click', startRoll);
            document.getElementById('stop-btn').addEventListener('click', stopRoll);
            document.getElementById('reset-btn').addEventListener('click', reset);
            document.getElementById('download-template-btn').addEventListener('click', downloadTemplate);
            document.getElementById('import-names-btn').addEventListener('click', importNames);
            document.getElementById('file-input').addEventListener('change', handleFileUpload);
            
            // 显示学生总数
            document.getElementById('count').textContent = students.length;
        }
        
        // 确保three.js加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
