<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>啤酒肚老师专属平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a2a26;
  --ink2: #5a6b65;
  --brand: #1a5f4e;
  --brand-dark: #0f4436;
  --accent: #e8a838;
  --bg: #f3f6f4;
  --card: #ffffff;
  --line: #d5ddd8;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

/* ===== 密码门 ===== */
.gate-wrap {
  background: linear-gradient(160deg, #0f4436 0%, #1a5f4e 60%, #2a7a63 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.gate {
  background: #fff;
  border-radius: 12px;
  padding: 36px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 24px 60px rgba(0,0,0,.25);
}
.gate .badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 600;
}
.gate h1 { font-size: 22px; margin-bottom: 6px; }
.gate .sub { font-size: 14px; color: var(--ink2); margin-bottom: 22px; }
.gate input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
}
.gate input:focus { border-color: var(--brand); }
.gate button {
  width: 100%;
  padding: 13px;
  background: var(--brand);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}
.gate button:hover { background: var(--brand-dark); }
.err { color: #d64545; font-size: 13px; margin-top: 10px; display: none; }

/* ===== 主界面 ===== */
.app { display: none; min-height: 100vh; flex-direction: column; }

.hero {
  background: linear-gradient(135deg, #0f4436 0%, #1a5f4e 100%);
  color: #fff;
  padding: 44px 32px 84px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: -80px; top: -80px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,168,56,.25), transparent 70%);
}
.hero .tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .22em;
  color: var(--accent);
  margin-bottom: 14px;
  font-weight: 600;
}
.hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
.hero p { font-size: 14.5px; opacity: .88; max-width: 520px; line-height: 1.7; }

.list-wrap {
  max-width: 900px;
  width: 100%;
  margin: -56px auto 0;
  padding: 0 32px 48px;
  flex: 1;
}
.list-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 18px;
}
.list-head h2 { font-size: 17px; font-weight: 600; }
.list-head span { font-size: 12px; color: var(--ink2); }

.item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all .18s ease;
  text-decoration: none;
  color: inherit;
}
.item:hover {
  border-color: var(--brand);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(26,95,78,.1);
}
.item .icon {
  width: 48px; height: 48px;
  flex: none;
  border-radius: 8px;
  background: #e8efeb;
  display: flex;
  align-items: center;
  justify-content: center;
}
.item:hover .icon { background: var(--brand); }
.item:hover .icon svg { stroke: #fff; }
.item .icon svg { stroke: var(--brand); transition: stroke .18s; }
.item .info { flex: 1; min-width: 0; }
.item .info h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}
.item .info p {
  font-size: 12.5px;
  color: var(--ink2);
  line-height: 1.5;
}
.item .arrow {
  flex: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #f0f4f1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand);
  font-size: 14px;
}

.loading {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink2);
  font-size: 13px;
}
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink2);
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--ink2);
  border-top: 1px solid var(--line);
  background: #fff;
}

@media (max-width: 640px) {
  .hero { padding: 36px 22px 76px; }
  .hero h1 { font-size: 25px; }
  .list-wrap { padding: 0 18px 36px; }
  .item { padding: 14px; gap: 12px; }
}
</style>
</head>
<body>

<div class="gate-wrap" id="gate">
  <div class="gate">
    <span class="badge">JINDU TEACHING</span>
    <h1>啤酒肚老师专属平台</h1>
    <p class="sub">请输入密码进入教学资源库。</p>
    <input type="password" id="pwd" placeholder="密码" autofocus>
    <button onclick="check()">进入平台</button>
    <div class="err" id="err">密码错误，请重试</div>
  </div>
</div>

<div class="app" id="app">
  <header class="hero">
    <span class="tag">TEACHING RESOURCES</span>
    <h1>啤酒肚老师专属平台</h1>
    <p>课件 · 互动网页 · 教学资料，都放在这里。点卡片直接打开。</p>
  </header>

  <main class="list-wrap">
    <div class="list-head">
      <h2>我的资源</h2>
      <span>点击卡片打开</span>
    </div>

    <div id="list">
      <div class="loading">正在加载资源…</div>
    </div>
  </main>

  <footer>© 啤酒肚老师专属平台 · 教学资源库</footer>
</div>

<script>
/* ============================================================
   资源列表自动生成配置区
   ------------------------------------------------------------
   上传新的 html 到 GitHub 仓库后，刷新本页会自动出现卡片。
   想给某个文件写好看的标题和介绍，就在下面 KNOWN 里加一条。
   没加进来的文件，会自动用文件名当标题显示。
   ============================================================ */
const REPO = 'PJD3865/jindu3865';

const KNOWN = {
  '物理.html':   { title: '物理互动课件', desc: '初中物理电学 · 电路实验台 · 串并联电路', icon: 'bolt' },
  '电路图.html': { title: '电路图画板',   desc: '二维标准电路图 · 拖元件连线 · 电流方向动画 · 上课讲题用', icon: 'circuit' },
  '光的折射.html': { title: '光的折射演示', desc: '光的折射现象 · 动画演示', icon: 'wave' },
  '信息技术.html': { title: '信息技术',     desc: '信息技术课件', icon: 'chip' }
};

const ORDER = ['电路图.html', '物理.html', '光的折射.html', '信息技术.html'];

const ICONS = {
  bolt:    '<path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>',
  circuit: '<circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M8 12h8M12 8v8" stroke-width="1.6" stroke-linecap="round"/>',
  wave:    '<path d="M3 12c3-6 6 6 9 0s6-6 9 0" stroke-width="1.6" stroke-linecap="round"/>',
  chip:    '<rect x="6" y="6" width="12" height="12" rx="2" stroke-width="1.6"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" stroke-width="1.6"/>',
  cube:    '<path d="M12 2l9 5v10l-9 5-9-5V7z" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7l9 5 9-5M12 12v10" stroke-width="1.6" stroke-linecap="round"/>',
  system:  '<rect x="3" y="4" width="18" height="7" rx="2" stroke-width="1.6"/><rect x="3" y="13" width="18" height="7" rx="2" stroke-width="1.6"/><circle cx="7" cy="7.5" r="1" stroke-width="1.4"/><circle cx="7" cy="16.5" r="1" stroke-width="1.4"/>',
  chart:   '<path d="M3 20h18" stroke-width="1.6" stroke-linecap="round"/><path d="M6 20V12M11 20V6M16 20v-5" stroke-width="1.6" stroke-linecap="round"/>',
  flask:   '<path d="M9 3h6M10 3v6l-5 8a2 2 0 002 3h10a2 2 0 002-3l-5-8V3" stroke-width="1.6" stroke-linecap="round"/>',
  leaf:    '<path d="M20 4c-9 0-15 5-15 12 0 2 1 4 3 4 7 0 12-6 12-16z" stroke-width="1.6"/><path d="M4 20c2-6 6-9 11-11" stroke-width="1.6" stroke-linecap="round"/>',
  play:    '<circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M10.5 8.5l6 3.5-6 3.5z" stroke-width="1.6"/>',
  edit:    '<path d="M12 20h9" stroke-width="1.6" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" stroke-width="1.6"/>',
  book:    '<path d="M4 4h6a2 2 0 012 2v14a2 2 0 00-2-2H4z" stroke-width="1.6"/><path d="M20 4h-6a2 2 0 00-2 2v14a2 2 0 012-2h6z" stroke-width="1.6"/>',
  globe:   '<circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18" stroke-width="1.6"/>',
  target:  '<circle cx="12" cy="12" r="9" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke-width="1.6"/><circle cx="12" cy="12" r="1" stroke-width="1.2"/>',
  dumbbell:'<path d="M7 12h10" stroke-width="1.6"/><rect x="3" y="8.5" width="3" height="7" rx="1" stroke-width="1.6"/><rect x="18" y="8.5" width="3" height="7" rx="1" stroke-width="1.6"/>',
  music:   '<path d="M9 18V6l10-2v12" stroke-width="1.6" stroke-linecap="round"/><circle cx="6.5" cy="18" r="2.5" stroke-width="1.6"/><circle cx="16.5" cy="16" r="2.5" stroke-width="1.6"/>',
  palette: '<circle cx="12" cy="12" r="9" stroke-width="1.6"/><circle cx="8" cy="9" r="1.4" stroke-width="1.2"/><circle cx="15" cy="9" r="1.4" stroke-width="1.2"/><circle cx="9" cy="16" r="1.4" stroke-width="1.2"/>',
  hourglass:'<path d="M7 3h10M7 21h10" stroke-width="1.6" stroke-linecap="round"/><path d="M8 3v4l4 3 4-3V3M8 21v-4l4-3 4 3v4" stroke-width="1.6" stroke-linejoin="round"/>',
  scale:   '<path d="M12 4v16M6 8h12" stroke-width="1.6" stroke-linecap="round"/><path d="M6 8l-3 6h6zM18 8l-3 6h6z" stroke-width="1.4" stroke-linejoin="round"/>',
  shield:  '<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z" stroke-width="1.6" stroke-linejoin="round"/>',
  heart:   '<path d="M12 20s-7-4.5-7-9.5A4 4 0 0112 7a4 4 0 017 3.5c0 5-7 9.5-7 9.5z" stroke-width="1.6"/>',
  clock:   '<circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke-width="1.6" stroke-linecap="round"/>',
  image:   '<rect x="3" y="4" width="18" height="16" rx="2" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.5" stroke-width="1.4"/><path d="M3 17l5-5 4 4 3-3 6 6" stroke-width="1.6" stroke-linecap="round"/>',
  table:   '<rect x="3" y="4" width="18" height="16" rx="2" stroke-width="1.6"/><path d="M3 9h18M9 9v11M15 9v11" stroke-width="1.4"/>',
  file:    '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke-width="1.6"/><path d="M14 2v6h6" stroke-width="1.6"/>'
};

/* 根据文件名关键词自动选图标 */
function guessIcon(name) {
  const n = name.replace(/\.html?$/i, '');
  // 更具体的规则放前面
  if (/点名|签到|考勤|打卡|名单/.test(n)) return 'target';
  if (/3D|3d|三维|立体/.test(n)) return 'cube';
  if (/电路|电学|并联|串联|欧姆/.test(n)) return 'circuit';
  if (/折射|反射|透镜|光学|凸透镜|凹透镜/.test(n)) return 'wave';
  if (/体育|篮球|足球|乒乓|排球|羽毛|健身|田径|跳绳|广播操|体能/.test(n)) return 'dumbbell';
  if (/音乐|歌曲|乐器|钢琴|合唱|乐理|节奏/.test(n)) return 'music';
  if (/美术|绘画|色彩|素描|手工|书法|设计/.test(n)) return 'palette';
  if (/历史|朝代|古代|近代|史料|中外史/.test(n)) return 'hourglass';
  if (/道法|道德|法治|法律|政治|公民|宪法/.test(n)) return 'scale';
  if (/安全|消防|防溺水|防骗|防诈|校园安全|疏散/.test(n)) return 'shield';
  if (/心理|情绪|青春期|健康|人际|成长/.test(n)) return 'heart';
  if (/课表|课程表|日程|计划|倒计时|时间表|作息/.test(n)) return 'clock';
  if (/化学|溶液|元素|反应|分子/.test(n)) return 'flask';
  if (/生物|细胞|植物|遗传|人体|生态/.test(n)) return 'leaf';
  if (/成绩|排名|数据|表格|统计表|报表/.test(n)) return 'table';
  if (/物理|力学|速度|压强|浮力|杠杆|机械/.test(n)) return 'bolt';
  if (/数学|函数|几何|三角|方程|概率|统计/.test(n)) return 'chart';
  if (/英语|语文|单词|阅读|作文|古诗|课文|词汇|语法/.test(n)) return 'book';
  if (/地理|地图|世界|地球|气候|地形/.test(n)) return 'globe';
  if (/信息|计算机|编程|代码|算法|人工智能|AI/.test(n)) return 'chip';
  if (/视频|动画|演示|播放|短片/.test(n)) return 'play';
  if (/试卷|练习|测试|考试|题目|作业|复习/.test(n)) return 'edit';
  if (/管理|平台|系统|后台|登录|中心/.test(n)) return 'system';
  if (/成绩|排名|数据|表格|统计表|报表/.test(n)) return 'table';
  if (/图片|相册|照片|图集|图片展/.test(n)) return 'image';
  return 'file';
}

/* ---------- 密码门 ---------- */
function check() {
  var v = document.getElementById('pwd').value;
  if (v === '8888') {
    sessionStorage.setItem('ok', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadList();
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
}
document.getElementById('pwd').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') check();
});

/* ---------- 列表加载 ---------- */
let loaded = false;

function loadList() {
  if (loaded) return;
  loaded = true;

  // 先用缓存渲染，避免每次都要等网络
  let cached = null;
  try {
    const raw = localStorage.getItem('jindu_files');
    if (raw) {
      const o = JSON.parse(raw);
      if (Date.now() - o.t < 10 * 60 * 1000) cached = o.files;
    }
  } catch (e) {}

  if (cached && cached.length) renderList(cached);

  fetch('https://api.github.com/repos/' + REPO + '/contents/')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      const files = data
        .filter(f => f.type === 'file' && /\.html?$/i.test(f.name) && f.name.toLowerCase() !== 'index.html')
        .map(f => f.name);
      if (files.length) {
        try {
          localStorage.setItem('jindu_files', JSON.stringify({ t: Date.now(), files: files }));
        } catch (e) {}
        renderList(files);
      }
    })
    .catch(() => {
      if (!cached) renderList(Object.keys(KNOWN));
    });
}

function sortFiles(list) {
  const known = ORDER.filter(n => list.indexOf(n) >= 0);
  const rest = list.filter(n => ORDER.indexOf(n) < 0).sort((a, b) => a.localeCompare(b, 'zh'));
  const others = list.filter(n => KNOWN[n] && ORDER.indexOf(n) < 0 && known.indexOf(n) < 0);
  return known.concat(rest);
}

function renderList(files) {
  const box = document.getElementById('list');
  const sorted = sortFiles(files);
  if (!sorted.length) {
    box.innerHTML = '<div class="empty">还没有资源，去 GitHub 上传 html 文件吧</div>';
    return;
  }
  let html = '';
  sorted.forEach(function(name) {
    const auto = { title: name.replace(/\.html?$/i, ''), desc: '点击打开', icon: guessIcon(name) };
    const meta = KNOWN[name] || auto;
    if (!meta.icon) meta.icon = guessIcon(name);
    const href = encodeURIComponent(name);
    html += '<a class="item" href="' + href + '" target="_blank">'
      + '<div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none">'
      + (ICONS[meta.icon] || ICONS.file)
      + '</svg></div>'
      + '<div class="info"><h3>' + esc(meta.title) + '</h3><p>' + esc(meta.desc) + '</p></div>'
      + '<div class="arrow">→</div></a>';
  });
  box.innerHTML = html;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- 自动进入（同一次会话内） ---------- */
if (sessionStorage.getItem('ok') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadList();
}

/* ---------- 防下载防护 ---------- */
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'F12') e.preventDefault();
  if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) e.preventDefault();
  if (e.ctrlKey && ['u','U','s','S','p','P'].includes(e.key)) e.preventDefault();
});
document.addEventListener('selectstart', function(e){ e.preventDefault(); });
document.addEventListener('dragstart', function(e){ e.preventDefault(); });
document.body.style.userSelect = 'none';
setInterval(function(){
  if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
    document.body.style.filter = 'blur(20px)';
  }
}, 1500);
</script>

</body>
</html>
