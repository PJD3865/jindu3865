      const stamp=new Date().toLocaleString('sv-SE').replaceAll(':','-').replace(' ','_'),filename='电路实验台_'+stamp+'.png';

<script>
/* 撤回功能：真正撤销——利用引擎"点导线断开"和"删除器材"逻辑 */
(function(){
  var wireHistory = [];    // 存导线 <g> 元素
  var compHistory = [];     // 存元件元素
  var wireLayer = document.getElementById('wireLayer');
  var stage = document.getElementById('stage');

  // 监听新增导线
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(node){
        if(node.nodeType===1 && node.tagName==='g' && node.querySelector('.wire-hit')){
          wireHistory.push(node);
        }
      });
    });
  }).observe(wireLayer, {childList:true, subtree:true});

  // 监听新增元件
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(node){
        if(node.nodeType===1 && node.classList && node.classList.contains('lab-component')){
          compHistory.push(node);
        }
      });
    });
  }).observe(stage, {childList:true, subtree:true});

  function fire(el, type){
    el.dispatchEvent(new PointerEvent(type, {bubbles:true, cancelable:true, pointerId:1}));
    el.dispatchEvent(new MouseEvent(type, {bubbles:true, cancelable:true}));
  }

  document.getElementById('undoBtn').addEventListener('click', function(){
    // 1. 优先撤最后一根导线：模拟点它的 wire-hit（引擎自带"点导线断开"）
    while(wireHistory.length){
      var wire = wireHistory.pop();
      if(!wire.isConnected) continue;  // 已被手动断开，跳过
      var hit = wire.querySelector('.wire-hit');
      if(hit){ fire(hit,'pointerdown'); fire(hit,'pointerup'); fire(hit,'click'); }
      return;
    }
    // 2. 再撤最后添加的元件：选中后点"删除器材"
    while(compHistory.length){
      var comp = compHistory.pop();
      if(!comp.isConnected) continue;
      fire(comp,'pointerdown'); fire(comp,'pointerup'); fire(comp,'click');
      setTimeout(function(){
        var del = document.getElementById('deleteComponentBtn');
        if(del) del.click();
      }, 80);
      return;
    }
  });

  /* 短路按钮：绕过布线校验，直接把选中元件的两个接线柱短接 */
  var engineRef = null;
  function getEngine(){
    if(engineRef) return engineRef;
    if(window.__lab && window.__lab.engine){ engineRef = window.__lab.engine; return engineRef; }
    // hook LabComponent.setState 拿到 engine 引用
    if(window.VirtualLab && window.VirtualLab.LabComponent && !window.VirtualLab.LabComponent.__hooked){
      window.VirtualLab.LabComponent.__hooked = true;
      var orig = window.VirtualLab.LabComponent.prototype.setState;
      window.VirtualLab.LabComponent.prototype.setState = function(p, s){
        window.__engineRef = this.engine;
        return orig.call(this, p, s);
      };
    }
    if(window.__engineRef){ engineRef = window.__engineRef; return engineRef; }
    return null;
  }
  document.getElementById('shortBtn').addEventListener('click', function(){
    var eng = getEngine();
    if(!eng){ alert('引擎还在加载，等几秒再点'); return; }
    var sel = eng.selected;
    if(!sel){ alert('先用鼠标点一下要短路的灯泡或电阻'); return; }
    var ports = Object.entries(sel.definition.ports||{})
      .filter(function(x){ return x[1].kind === 'electricalTerminal'; })
      .map(function(x){ return x[0]; });
    if(ports.length < 2){ alert('这个元件没有两个接线柱，不能短路'); return; }
    var a = { componentId: sel.id, port: ports[0] };
    var b = { componentId: sel.id, port: ports[1] };
    // 检查是否已经短路过
    var exists = eng.connections.some(function(c){
      var ka = eng.terminalKey(a), kb = eng.terminalKey(b);
      return (eng.terminalKey(c.a)===ka && eng.terminalKey(c.b)===kb) ||
             (eng.terminalKey(c.a)===kb && eng.terminalKey(c.b)===ka);
    });
    if(exists){ alert('已经短路过了'); return; }
    var conn = eng.connect(a, b);
    if(conn){
      // 强制重算电路
      eng.bus.emit('connectionchange', { type:'connect', connection: conn });
      eng.bus.emit('statechange', { component: sel, patch: {} });
    } else {
      alert('短路失败');
    }
  });
})();
</script>
