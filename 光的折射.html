<body class="h-screen w-screen">

    <script>
        // 音频资源 - 详细讲解版
        const audioAngle = new Audio('https://metis-online.fbcontent.cn/metis-voice/1739343952000_0.mp3');
        const audioIndex = new Audio('https://metis-online.fbcontent.cn/metis-voice/1739343952000_1.mp3');
        
        // 状态管理
        const state = {
            angle: 45,
            n: 1.5,
            showNormal: true,
            showValues: true,
            showParticles: true,
            showExtend: false,
            glassWidth: 300,
            glassHeight: 150,
            zoom: 1.0,
            rotation: 0
        };

        // DOM 元素
        const els = {
            sliderAngle: document.getElementById('slider-angle'),
            sliderN: document.getElementById('slider-n'),
            checkNormal: document.getElementById('check-normal'),
            checkValues: document.getElementById('check-values'),
            checkParticles: document.getElementById('check-particles'),
            checkExtend: document.getElementById('check-extend'),
            valIncidence: document.getElementById('val-incidence'),
            valRefraction: document.getElementById('val-refraction'),
            valN: document.getElementById('val-n'),
            valShift: document.getElementById('val-shift')
        };

        // 播放控制
        let currentAudio = null;
        function playAudio(audio) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = audio;
            currentAudio.play().catch(e => console.log("Audio play failed (interaction needed):", e));
        }

        // 事件监听
        els.sliderAngle.addEventListener('input', (e) => state.angle = parseFloat(e.target.value));
        els.sliderN.addEventListener('input', (e) => state.n = parseFloat(e.target.value));
        
        // 拖动结束时触发语音讲解
        els.sliderAngle.addEventListener('change', () => playAudio(audioAngle));
        els.sliderN.addEventListener('change', () => playAudio(audioIndex));

        els.checkNormal.addEventListener('change', (e) => state.showNormal = e.target.checked);
        els.checkValues.addEventListener('change', (e) => state.showValues = e.target.checked);
        els.checkParticles.addEventListener('change', (e) => state.showParticles = e.target.checked);
        els.checkExtend.addEventListener('change', (e) => state.showExtend = e.target.checked);

        // p5.js 逻辑
        function setup() {
            const canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('canvas-container');
            textFont('sans-serif');
            // 禁用右键菜单以支持右键交互
            document.oncontextmenu = () => false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function mouseWheel(event) {
            // 滚轮缩放
            state.zoom -= event.delta * 0.001;
            state.zoom = constrain(state.zoom, 0.5, 3.0);
            return false; // 阻止默认滚动
        }

        // 粒子系统
        let particles = [];
        class Photon {
            constructor(path) {
                this.path = path;
                this.currentSeg = 0;
                this.progress = 0;
                this.speed = 0.02;
                this.finished = false;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.progress = 0;
                    this.currentSeg++;
                    if (this.currentSeg >= this.path.length - 1) {
                        this.finished = true;
                    }
                }
            }

            draw() {
                if (this.finished) return;
                const p1 = this.path[this.currentSeg];
                const p2 = this.path[this.currentSeg + 1];
                const x = lerp(p1.x, p2.x, this.progress);
                const y = lerp(p1.y, p2.y, this.progress);
                
                noStroke();
                // 粒子发光效果
                for(let i=0; i<3; i++) {
                    fill(0, 242, 255, 100 - i*30);
                    circle(x, y, 8 + i*4);
                }
                fill(255, 255, 255);
                circle(x, y, 4);
            }
        }

        function draw() {
            clear();
            
            // 绘制科技感背景网格
            drawGrid();

            // 坐标变换到中心
            translate(width / 2, height / 2);
            
            // 应用视图变换 (缩放和旋转)
            scale(state.zoom);
            rotate(state.rotation);
            
            // 计算物理量
            const iRad = radians(state.angle);
            let rRad = Math.asin(Math.sin(iRad) / state.n);
            if (isNaN(rRad)) rRad = 0;
            const rDeg = degrees(rRad);
            
            // 更新UI数值
            els.valIncidence.innerText = state.angle.toFixed(1) + '°';
            els.valRefraction.innerText = rDeg.toFixed(1) + '°';
            els.valN.innerText = state.n.toFixed(2);
            const shift = state.glassHeight * Math.sin(iRad - rRad) / Math.cos(rRad);
            els.valShift.innerText = shift.toFixed(1);

            // 关键点坐标
            const glassTopY = -state.glassHeight / 2;
            const glassBottomY = state.glassHeight / 2;
            const pIncident = createVector(0, glassTopY);
            const lightLen = 400;
            const pSource = createVector(
                pIncident.x - lightLen * sin(iRad),
                pIncident.y - lightLen * cos(iRad)
            );
            const dx = state.glassHeight * Math.tan(rRad);
            const pExit = createVector(dx, glassBottomY);
            const pFinal = createVector(
                pExit.x + lightLen * sin(iRad),
                pExit.y + lightLen * cos(iRad)
            );

            // --- 绘图层 ---
            drawGlass(glassTopY, glassBottomY);

            if (state.showNormal) {
                drawNormals(pIncident, pExit);
            }

            drawLightRays(pSource, pIncident, pExit, pFinal);

            if (state.showExtend) {
                drawExtensions(pSource, pIncident, pExit);
            }

            if (state.showValues) {
                drawAngles(pIncident, pExit, iRad, rRad);
            }

            if (state.showParticles) {
                handleParticles([pSource, pIncident, pExit, pFinal]);
            }
        }

        function drawGrid() {
            push();
            stroke(255, 255, 255, 10);
            strokeWeight(1);
            const step = 50;
            const offsetX = (frameCount * 0.5) % step;
            const offsetY = (frameCount * 0.5) % step;
            
            for (let x = 0; x < width; x += step) line(x, 0, x, height);
            for (let y = 0; y < height; y += step) line(0, y, width, y);
            pop();
        }

        function drawGlass(topY, bottomY) {
            push();
            // 玻璃主体
            fill(0, 242, 255, 30);
            stroke(0, 242, 255, 150);
            strokeWeight(2);
            rectMode(CENTER);
            rect(0, 0, state.glassWidth, state.glassHeight);
            
            // 玻璃高光装饰
            noStroke();
            fill(255, 255, 255, 20);
            rect(0, -state.glassHeight/4, state.glassWidth, 2);
            
            // 标注介质
            fill(0, 242, 255);
            textAlign(LEFT, TOP);
            textSize(14);
            text(`玻璃 (n=${state.n.toFixed(2)})`, -state.glassWidth/2 + 10, topY + 10);
            fill(150, 150, 150);
            text("空气 (n=1.00)", -state.glassWidth/2 + 10, topY - 30);
            pop();
        }

        function drawNormals(p1, p2) {
            push();
            stroke(255, 255, 255, 100);
            strokeWeight(1);
            drawingContext.setLineDash([5, 5]);
            line(0, p1.y - 100, 0, p1.y + 100);
            line(p2.x, p2.y - 100, p2.x, p2.y + 100);
            drawingContext.setLineDash([]);
            pop();
        }

        function drawLightRays(pSource, pIncident, pExit, pFinal) {
            push();
            stroke(0, 242, 255);
            strokeWeight(3);
            // 外发光
            drawingContext.shadowBlur = 15;
            drawingContext.shadowColor = '#00f2ff';
            
            line(pSource.x, pSource.y, pIncident.x, pIncident.y);
            drawArrow(pSource, pIncident, 0.5);
            
            stroke(0, 242, 255, 180);
            line(pIncident.x, pIncident.y, pExit.x, pExit.y);
            drawArrow(pIncident, pExit, 0.5);
            
            stroke(0, 242, 255);
            line(pExit.x, pExit.y, pFinal.x, pFinal.y);
            drawArrow(pExit, pFinal, 0.5);
            
            drawingContext.shadowBlur = 0;
            pop();
        }

        function drawExtensions(pSource, pIncident, pExit) {
            push();
            stroke(255, 0, 85, 100);
            strokeWeight(1);
            drawingContext.setLineDash([8, 4]);
            let dir = p5.Vector.sub(pIncident, pSource).normalize().mult(600);
            let pFar = p5.Vector.add(pIncident, dir);
            line(pIncident.x, pIncident.y, pFar.x, pFar.y);
            pop();
        }

        function drawArrow(p1, p2, ratio) {
            let v = p5.Vector.sub(p2, p1);
            let pos = p5.Vector.add(p1, p5.Vector.mult(v, ratio));
            let angle = v.heading();
            push();
            translate(pos.x, pos.y);
            rotate(angle);
            fill(0, 242, 255);
            noStroke();
            triangle(-8, -5, 8, 0, -8, 5);
            pop();
        }

        function drawAngles(pIncident, pExit, iRad, rRad) {
            push();
            noFill();
            strokeWeight(2);
            textSize(14);
            textAlign(CENTER, CENTER);
            
            // --- 1. 入射点 (上表面) ---
            
            // 入射角 i (空气中)
            // 法线: 向上 (-PI/2)
            // 光线来源: 左上 (-PI/2 - i)
            stroke(0, 242, 255); 
            arc(pIncident.x, pIncident.y, 50, 50, -PI/2 - iRad, -PI/2);
            
            noStroke();
            fill(0, 242, 255);
            // 文字位置: 角平分线方向
            let txtPosI = p5.Vector.fromAngle(-PI/2 - iRad/2).mult(40).add(pIncident);
            text("i", txtPosI.x, txtPosI.y);

            // 折射角 r (玻璃中)
            // 法线: 向下 (PI/2)
            // 折射光线: 右下 (PI/2 - r)
            // 修正：光线在法线右侧，应逆时针画
            noFill();
            stroke(255, 0, 85);
            arc(pIncident.x, pIncident.y, 50, 50, PI/2 - rRad, PI/2);
            
            noStroke();
            fill(255, 0, 85);
            let txtPosR = p5.Vector.fromAngle(PI/2 - rRad/2).mult(40).add(pIncident);
            text("r", txtPosR.x, txtPosR.y);

            // --- 2. 出射点 (下表面) ---

            // 内部入射角 r' (玻璃中)
            // 法线: 向上 (-PI/2)
            // 光线来源: 左上 (-PI/2 - r)
            noFill();
            stroke(255, 0, 85);
            arc(pExit.x, pExit.y, 50, 50, -PI/2 - rRad, -PI/2);
            
            noStroke();
            fill(255, 0, 85);
            let txtPosR2 = p5.Vector.fromAngle(-PI/2 - rRad/2).mult(40).add(pExit);
            text("r'", txtPosR2.x, txtPosR2.y);
            
            // 出射角 i' (空气中)
            // 法线: 向下 (PI/2)
            // 出射光线: 右下 (PI/2 - i)
            // 修正：光线在法线右侧，应逆时针画
            noFill();
            stroke(0, 242, 255);
            arc(pExit.x, pExit.y, 50, 50, PI/2 - iRad, PI/2);
            
            noStroke();
            fill(0, 242, 255);
            let txtPosI2 = p5.Vector.fromAngle(PI/2 - iRad/2).mult(40).add(pExit);
            text("i'", txtPosI2.x, txtPosI2.y);
            
            pop();
        }

        function handleParticles(path) {
            if (frameCount % 15 === 0) {
                particles.push(new Photon(path));
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].path = path;
                particles[i].update();
                particles[i].draw();
                if (particles[i].finished) {
                    particles.splice(i, 1);
                }
            }
        }

        function mouseDragged() {
            // 右键拖拽旋转视图
            if (mouseButton === RIGHT) {
                state.rotation += (mouseX - pmouseX) * 0.01;
                return;
            }

            // 左键拖拽调节入射角
            if (mouseY < height - 200) { // 避开底部UI
                // 计算鼠标相对于中心的向量
                let dx = mouseX - width/2;
                let dy = mouseY - height/2;
                
                // 逆变换：先逆旋转，再逆缩放
                let v = createVector(dx, dy);
                v.rotate(-state.rotation);
                v.div(state.zoom);
                
                // 修正后的坐标
                let localX = v.x;
                let localY = v.y + state.glassHeight/2; // 加上偏移量以相对于入射点

                if (localY < 0) {
                    let angle = degrees(atan2(localX, localY));
                    let newAngle = -angle;
                    if (newAngle >= 0 && newAngle <= 85) {
                        state.angle = newAngle;
                        els.sliderAngle.value = newAngle;
                    }
                }
            }
        }
        
        // 鼠标释放时也触发语音（如果是通过拖拽画面改变的角度）
        function mouseReleased() {
             if (mouseY < height - 200) {
                 playAudio(audioAngle);
             }
        }
    </script>
